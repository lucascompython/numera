[package]
name = "numera"
version = "0.1.0"
edition = "2024"

default-run = "numera"

[target.'cfg(target_arch = "aarch64-apple-darwin")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }

[target.'cfg(not(target_arch = "aarch64-apple-darwin"))'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = ["font-kit", "x11", "wayland"] }

[dependencies]
# TODO: update gpui
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui-component = { git = "https://github.com/longbridgeapp/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridgeapp/gpui-component" }
image = { version = "0.25", default-features = false, features = ["rayon", "jpeg", "png"] }
imageproc = { version = "0.27", default-features = false, features = ["rayon", "text"] }
ab_glyph = "0.2"
rayon = "1"
rfd = "0.17"
pdf-writer = "0.15"
tokio = { version = "1", features = ["fs", "sync", "rt-multi-thread"] }
turbojpeg = "1.4"
mimalloc = { version = "0.1", features = ["v3"] }
lru = "0.18"
parking_lot = "0.12"
anyhow = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
opencv = { version = "0.99", default-features = false, features = ["clang-runtime", "calib3d", "features2d", "imgcodecs", "imgproc", "photo"] }
ort = "2.0.0-rc"
openssl = { version = "*", features = ["vendored"] }

# High-performance concurrent containers
scc = "3"
rapidhash = { version = "4", features = ["unsafe", "nightly", "rng"] }

# OCR (ONNX Runtime backend)
oar-ocr = "0.6"

# benchmark-only dependencies (behind 'bench' feature)
zune-jpeg = { version = "0.5", optional = true }
zune-imageprocs = { version = "0.5", optional = true }
memmap2 = "0.9"
zune-core = { version = "0.5", optional = true }
zune-image = { version = "0.5", default-features = false, features = ["simd", "threads", "jpeg"], optional = true }
jpeg-encoder = { version = "0.7", optional = true }


[features]
bench = ["zune-jpeg", "zune-imageprocs", "zune-core", "zune-image", "jpeg-encoder"]
# Optional OCR GPU/accelerator providers (enable when building on supported machines)
ocr-cuda = ["oar-ocr/cuda"]
ocr-tensorrt = ["oar-ocr/tensorrt"]
ocr-directml = ["oar-ocr/directml"]
ocr-coreml = ["oar-ocr/coreml"]
ocr-openvino = ["oar-ocr/openvino"]
ocr-webgpu = ["oar-ocr/webgpu"]



[[bin]]
name = "jpeg_bench"
path = "src/bin/jpeg_bench.rs"
required-features = ["bench"]



[profile.dev]
debug = false
strip = "debuginfo"

[profile.dev.build-override]
opt-level = 3

[profile.dev.package]
gpui = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
gpui_macros = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true        # Enables link-time-optimizations.
# opt-level = "z"   # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort"   # Higher performance by disabling panic handlers.
strip = true      # Ensures debug symbols are removed.

[patch.crates-io]
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
