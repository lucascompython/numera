name: Build

on:
  push:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build (x86_64 Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu
          components: rust-src

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            cmake \
            pkg-config \
            libopencv-dev \
            libturbojpeg0-dev \
            libfontconfig1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-render0-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libvulkan-dev \
            libssl-dev \
            libclang-dev \
            clang \
            nasm

      # libxkbcommon-wayland-dev \
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo xtask speed

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: numera-linux-x86_64
          path: target/x86_64-unknown-linux-gnu/release/numera

  build-windows:
    name: Build (x86_64 Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-pc-windows-msvc
          components: rust-src

      - name: Download OpenCV
        run: |
          curl -L -o opencv.exe "https://github.com/opencv/opencv/releases/download/4.13.0/opencv-4.13.0-windows.exe"
          7z x opencv.exe -oC:\
        shell: pwsh

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo xtask speed
        env:
          OPENCV_LINK_LIBS: opencv_core4130,opencv_imgproc4130,opencv_imgcodecs4130,opencv_photo4130,opencv_calib3d4130,opencv_features2d4130
          OPENCV_LINK_PATHS: C:\opencv\build\x64\vc16\lib
          OPENCV_INCLUDE_PATHS: C:\opencv\build\include

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: numera-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/numera.exe

  build-macos:
    name: Build (aarch64 macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-apple-darwin
          components: rust-src

      - name: Install dependencies via Homebrew
        run: |
          brew install opencv jpeg-turbo pkg-config cmake

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo xtask speed
        env:
          OPENCV_LINK_LIBS: opencv_core,opencv_imgproc,opencv_imgcodecs,opencv_photo,opencv_calib3d,opencv_features2d
          OPENCV_LINK_PATHS: /opt/homebrew/lib
          OPENCV_INCLUDE_PATHS: /opt/homebrew/include/opencv4

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: numera-macos-aarch64
          path: target/aarch64-apple-darwin/release/numera
